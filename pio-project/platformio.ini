; EE6003 Robotic Arm — PlatformIO project
; Each environment builds exactly one of the src/<folder>/main.cpp files.
;
; Build a specific environment:
;   pio run -e arm_mega
;   pio run -e controller_uno_r4
;   pio run -e hc05_configure
;
; Upload (auto-detects serial port, or pass --upload-port):
;   pio run -e arm_mega -t upload
;   pio run -e controller_uno_r4 -t upload
;
; Serial monitor:
;   pio device monitor -e arm_mega -b 115200

[platformio]
default_envs = arm_mega

; ---------- Shared settings ----------
[env]
framework = arduino
monitor_speed = 115200

; ---------- Arm side: Elegoo Mega 2560 R3 (drives the 4 servos) ----------
[env:arm_mega]
platform = atmelavr
board = megaatmega2560
build_src_filter = +<arm_mega/> -<controller_uno_r4/> -<hc05_configure/>
lib_deps =
    arduino-libraries/Servo @ ^1.2.1

; ---------- Controller side: Arduino Uno R4 Minima (joystick + HC-05 master) ----------
; Two-joystick + claw-pot scheme: joystick Y = shoulder/elbow, joystick SW =
; base spin, dedicated pot = claw position.
;
; platform_packages override: renesas-ra 1.8.0 pins toolchain-gccarmnoneeabi
; ~1.70201.0 (gcc-arm 7.2.1), which PlatformIO's registry no longer hosts.
; Pin the current available version instead.
[env:controller_uno_r4]
platform = renesas-ra
board = uno_r4_minima
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.140201.0
; gcc 14 promotes -Wreturn-mismatch to an error; TinyUSB in
; framework-arduinorenesas-uno returns a value from a void fn, so the build
; halts without this. Downgrade back to a warning; runtime is unaffected.
build_flags = -Wno-error=return-mismatch
build_src_filter = +<controller_uno_r4/> -<arm_mega/> -<hc05_configure/>
lib_deps =
    arduino-libraries/Servo @ ^1.2.1

; ---------- HC-05 AT-mode config sketch (run once per module, on the Mega) ----------
[env:hc05_configure]
platform = atmelavr
board = megaatmega2560
build_src_filter = +<hc05_configure/> -<arm_mega/> -<controller_uno_r4/>
lib_deps =
    arduino-libraries/Servo @ ^1.2.1

