; EE6003 Robotic Arm — PlatformIO project
; Four environments, each builds exactly one of the src/<folder>/main.cpp files.
;
; Build a specific environment:
;   pio run -e arm_mega
;   pio run -e controller_uno_r4
;   pio run -e hc05_configure
;   pio run -e esp32_color_detect
;
; Upload (auto-detects serial port, or pass --upload-port):
;   pio run -e arm_mega -t upload
;   pio run -e controller_uno_r4 -t upload
;   pio run -e esp32_color_detect -t upload
;
; Serial monitor:
;   pio device monitor -e arm_mega -b 115200
;   pio device monitor -e esp32_color_detect -b 115200

[platformio]
default_envs = arm_mega

; ---------- Shared settings ----------
; `lib_deps` here is AVR/Renesas-specific (Servo). The ESP32 env overrides it
; with its own deps, so Servo isn't dragged onto the ESP32.
[env]
framework = arduino
monitor_speed = 115200

; ---------- Arm side: Elegoo Mega 2560 R3 (drives the 4 servos) ----------
[env:arm_mega]
platform = atmelavr
board = megaatmega2560
build_src_filter = +<arm_mega/> -<controller_uno_r4/> -<controller_uno_r4_v2/> -<hc05_configure/> -<esp32_color_detect/>
lib_deps =
    arduino-libraries/Servo @ ^1.2.1

; ---------- Controller side: Arduino Uno R4 Minima (joystick + HC-05 master) ----------
; platform_packages override: renesas-ra 1.8.0 pins toolchain-gccarmnoneeabi ~1.70201.0
; (gcc-arm 7.2.1), which PlatformIO's registry no longer hosts. Pin the current
; available version instead. Same override applied to controller_uno_r4_v2 below.
[env:controller_uno_r4]
platform = renesas-ra
board = uno_r4_minima
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.140201.0
; gcc 14 promotes -Wreturn-mismatch to an error; TinyUSB in
; framework-arduinorenesas-uno returns a value from a void fn, so the build
; halts without this. Downgrade back to a warning; runtime is unaffected.
build_flags = -Wno-error=return-mismatch
build_src_filter = +<controller_uno_r4/> -<arm_mega/> -<controller_uno_r4_v2/> -<hc05_configure/> -<esp32_color_detect/>
lib_deps =
    arduino-libraries/Servo @ ^1.2.1

; ---------- Controller variant v2: joysticks = shoulder/elbow, SW hold = base spin, 2 PBs = claw ----------
; Builds an alternate firmware for the Uno R4 Minima from src/controller_uno_r4_v2/
; without touching the original controller_uno_r4 build. Pick whichever to flash:
;   pio run -e controller_uno_r4    -t upload     # original 4-axis joystick scheme
;   pio run -e controller_uno_r4_v2 -t upload     # new scheme with claw push-buttons
[env:controller_uno_r4_v2]
platform = renesas-ra
board = uno_r4_minima
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.140201.0
build_flags = -Wno-error=return-mismatch
build_src_filter = +<controller_uno_r4_v2/> -<arm_mega/> -<controller_uno_r4/> -<hc05_configure/> -<esp32_color_detect/>
lib_deps =
    arduino-libraries/Servo @ ^1.2.1

; ---------- HC-05 AT-mode config sketch (run once per module, on the Mega) ----------
[env:hc05_configure]
platform = atmelavr
board = megaatmega2560
build_src_filter = +<hc05_configure/> -<arm_mega/> -<controller_uno_r4/> -<controller_uno_r4_v2/> -<esp32_color_detect/>
lib_deps =
    arduino-libraries/Servo @ ^1.2.1

; ---------- Camera side: Freenove ESP32-WROVER CAM (FNK0060) ----------
; Runs on-board HSV colour detection, sends results to the Mega over UART2,
; and serves a live MJPEG view on http://192.168.4.1/ over its own soft-AP.
;
; The board variant `esp-wrover-kit` has PSRAM enabled by default, which the
; OV2640 framebuffer needs. esp32-camera ships with the Arduino-ESP32 core,
; so no extra lib_dep is required.
[env:esp32_color_detect]
platform = espressif32
board = esp-wrover-kit
framework = arduino
build_src_filter = +<esp32_color_detect/> -<arm_mega/> -<controller_uno_r4/> -<controller_uno_r4_v2/> -<hc05_configure/>
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
monitor_speed = 115200
upload_speed = 460800
