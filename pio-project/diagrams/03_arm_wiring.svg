<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" role="img">
  <title>Arm-side wiring diagram</title>
  <desc>Full wiring for the arm side: Mega 2560 driving four servos with external battery power, HC-05 slave on Serial1 with a voltage divider on RX, common ground.</desc>

  <style>
    .ttl { font: 500 22px system-ui, sans-serif; fill: #1a1a1a; }
    .h   { font: 500 15px system-ui, sans-serif; fill: #1a1a1a; }
    .hb  { font: 500 16px system-ui, sans-serif; fill: #ffffff; }
    .lbl { font: 400 13px system-ui, sans-serif; fill: #1a1a1a; }
    .sub { font: 400 12px system-ui, sans-serif; fill: #555; }
    .pin { font: 400 12px monospace; fill: #1a1a1a; }
    .pinw{ font: 400 12px monospace; fill: #ffffff; }
    .note{ font: 400 12px system-ui, sans-serif; fill: #6a4e00; }
    .legend-box{ fill: #fafafa; stroke: #b4b2a9; stroke-width: 1; }
    .wpos{ stroke: #d32f2f; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wgnd{ stroke: #263238; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wsig{ stroke: #F9A825; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wtx { stroke: #1565C0; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wrx { stroke: #2E7D32; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #263238; stroke: none; }
    .dotr{ fill: #d32f2f; stroke: none; }
    .resistor { stroke: #1a1a1a; stroke-width: 1.8; fill: none; }
  </style>

  <text x="600" y="34" text-anchor="middle" class="ttl">Arm side — full wiring</text>
  <text x="600" y="56" text-anchor="middle" class="sub">Mega 2560 · 3× MG996R + 1× SG90 · HC-05 slave · 4×AA battery for servos</text>

  <rect x="40" y="90" width="220" height="140" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="150" y="118" text-anchor="middle" class="h" fill="#27500A">HC-05 (slave)</text>
  <text x="150" y="138" text-anchor="middle" class="sub" fill="#27500A">AT+NAME=ARM</text>
  <circle cx="85"  cy="170" r="5" class="dotr"/><text x="95"  y="174" class="pin">VCC</text>
  <circle cx="85"  cy="195" r="5" class="dot"/><text x="95"  y="199" class="pin">GND</text>
  <circle cx="215" cy="170" r="5" fill="#1565C0"/><text x="205" y="174" text-anchor="end" class="pin">TXD</text>
  <circle cx="215" cy="195" r="5" fill="#2E7D32"/><text x="205" y="199" text-anchor="end" class="pin">RXD</text>

  <path d="M 370 210 L 382 200 L 398 220 L 414 200 L 430 220 L 446 200 L 462 220 L 478 210" class="resistor"/>
  <text x="424" y="188" text-anchor="middle" class="pin">R1 = 1 kΩ  (top)</text>
  <circle cx="370" cy="210" r="4" class="dot"/>
  <circle cx="478" cy="210" r="4" class="dot"/>

  <path d="M 370 245 L 360 257 L 380 273 L 360 289 L 380 305 L 360 321 L 380 337 L 370 350" class="resistor"/>
  <text x="395" y="300" class="pin">R2 = 2 kΩ  (to GND)</text>
  <circle cx="370" cy="245" r="4" class="dot"/>
  <circle cx="370" cy="350" r="4" class="dot"/>

  <path class="wrx" d="M 220 170 L 290 170 L 290 210 L 290 260 L 600 260 L 600 310"/>
  <path class="wtx" d="M 600 310 L 600 210 L 478 210"/>
  <path class="wtx" d="M 370 210 L 220 210 L 220 195"/>
  <circle cx="600" cy="310" r="4" class="dot"/>

  <path class="wpos" d="M 85 170 L 85 440 L 530 440 L 530 570"/>
  <circle cx="530" cy="570" r="4" class="dotr"/>
  <text x="88" y="320" class="sub" fill="#d32f2f">HC-05 VCC → 5 V</text>

  <rect x="440" y="310" width="340" height="300" rx="12" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>
  <text x="610" y="345" text-anchor="middle" class="hb" fill="#0C447C">Arduino Mega 2560</text>
  <text x="610" y="365" text-anchor="middle" class="sub" fill="#0C447C">on the arm base</text>
  <rect x="420" y="380" width="30" height="42" fill="#888" stroke="#333" stroke-width="1"/>
  <text x="435" y="433" text-anchor="middle" class="pin">USB</text>

  <circle cx="600" cy="310" r="5" fill="#2E7D32"/>
  <text x="608" y="303" class="pin">D19 (RX1)</text>
  <circle cx="660" cy="310" r="5" fill="#1565C0"/>
  <text x="668" y="303" class="pin">D18 (TX1)</text>

  <circle cx="780" cy="410" r="5" fill="#F9A825"/>
  <text x="772" y="414" text-anchor="end" class="pin">D11</text>
  <circle cx="780" cy="450" r="5" fill="#F9A825"/>
  <text x="772" y="454" text-anchor="end" class="pin">D10</text>
  <circle cx="780" cy="490" r="5" fill="#F9A825"/>
  <text x="772" y="494" text-anchor="end" class="pin">D9</text>
  <circle cx="780" cy="530" r="5" fill="#F9A825"/>
  <text x="772" y="534" text-anchor="end" class="pin">D6</text>

  <circle cx="510" cy="610" r="5" class="dot"/><text x="512" y="628" class="pin">GND</text>
  <circle cx="570" cy="610" r="5" class="dotr"/><text x="572" y="628" class="pin">5V</text>
  <circle cx="630" cy="610" r="5" class="dot"/><text x="632" y="628" class="pin">GND</text>

  <rect x="860" y="80"  width="300" height="110" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.4"/>
  <text x="1010" y="110" text-anchor="middle" class="h" fill="#412402">Base (MG996R)</text>
  <text x="1010" y="130" text-anchor="middle" class="sub" fill="#412402">yaw — joint 1</text>
  <rect x="860" y="220" width="300" height="110" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.4"/>
  <text x="1010" y="250" text-anchor="middle" class="h" fill="#412402">Shoulder (MG996R)</text>
  <text x="1010" y="270" text-anchor="middle" class="sub" fill="#412402">pitch — joint 2</text>
  <rect x="860" y="360" width="300" height="110" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.4"/>
  <text x="1010" y="390" text-anchor="middle" class="h" fill="#412402">Elbow (MG996R)</text>
  <text x="1010" y="410" text-anchor="middle" class="sub" fill="#412402">pitch — joint 3</text>
  <rect x="860" y="500" width="300" height="110" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.4"/>
  <text x="1010" y="530" text-anchor="middle" class="h" fill="#412402">Claw (SG90)</text>
  <text x="1010" y="550" text-anchor="middle" class="sub" fill="#412402">gripper</text>

  <circle cx="860" cy="115" r="5" fill="#F9A825"/><text x="850" y="119" text-anchor="end" class="pin">SIG</text>
  <circle cx="860" cy="135" r="5" class="dotr"/><text x="850" y="139" text-anchor="end" class="pin">V+</text>
  <circle cx="860" cy="155" r="5" class="dot"/><text x="850" y="159" text-anchor="end" class="pin">GND</text>

  <circle cx="860" cy="255" r="5" fill="#F9A825"/><text x="850" y="259" text-anchor="end" class="pin">SIG</text>
  <circle cx="860" cy="275" r="5" class="dotr"/><text x="850" y="279" text-anchor="end" class="pin">V+</text>
  <circle cx="860" cy="295" r="5" class="dot"/><text x="850" y="299" text-anchor="end" class="pin">GND</text>

  <circle cx="860" cy="395" r="5" fill="#F9A825"/><text x="850" y="399" text-anchor="end" class="pin">SIG</text>
  <circle cx="860" cy="415" r="5" class="dotr"/><text x="850" y="419" text-anchor="end" class="pin">V+</text>
  <circle cx="860" cy="435" r="5" class="dot"/><text x="850" y="439" text-anchor="end" class="pin">GND</text>

  <circle cx="860" cy="535" r="5" fill="#F9A825"/><text x="850" y="539" text-anchor="end" class="pin">SIG</text>
  <circle cx="860" cy="555" r="5" class="dotr"/><text x="850" y="559" text-anchor="end" class="pin">V+</text>
  <circle cx="860" cy="575" r="5" class="dot"/><text x="850" y="579" text-anchor="end" class="pin">GND</text>

  <path class="wsig" d="M 780 490 L 820 490 L 820 115 L 860 115"/>
  <path class="wsig" d="M 780 450 L 815 450 L 815 255 L 860 255"/>
  <path class="wsig" d="M 780 410 L 810 410 L 810 395 L 860 395"/>
  <path class="wsig" d="M 780 530 L 820 530 L 820 535 L 860 535"/>

  <line x1="830" y1="135" x2="830" y2="695" class="wpos"/>
  <line x1="830" y1="135" x2="860" y2="135" class="wpos"/>
  <line x1="830" y1="275" x2="860" y2="275" class="wpos"/>
  <line x1="830" y1="415" x2="860" y2="415" class="wpos"/>
  <line x1="830" y1="555" x2="860" y2="555" class="wpos"/>

  <line x1="845" y1="155" x2="845" y2="695" class="wgnd"/>
  <line x1="845" y1="155" x2="860" y2="155" class="wgnd"/>
  <line x1="845" y1="295" x2="860" y2="295" class="wgnd"/>
  <line x1="845" y1="435" x2="860" y2="435" class="wgnd"/>
  <line x1="845" y1="575" x2="860" y2="575" class="wgnd"/>

  <rect x="760" y="640" width="150" height="50" rx="6" fill="#fff8e1" stroke="#b26500" stroke-width="1.2"/>
  <text x="835" y="660" text-anchor="middle" class="h" fill="#854F0B">Bulk cap</text>
  <text x="835" y="678" text-anchor="middle" class="note">220–470 µF across V+/GND</text>

  <rect x="120" y="710" width="520" height="180" rx="10" fill="#fafafa" stroke="#555" stroke-width="1.5"/>
  <text x="380" y="738" text-anchor="middle" class="h">4 × AA battery pack  (≈ 6 V)</text>
  <rect x="150" y="760" width="55" height="80" rx="4" fill="#fff" stroke="#888" stroke-width="1"/>
  <rect x="215" y="760" width="55" height="80" rx="4" fill="#fff" stroke="#888" stroke-width="1"/>
  <rect x="280" y="760" width="55" height="80" rx="4" fill="#fff" stroke="#888" stroke-width="1"/>
  <rect x="345" y="760" width="55" height="80" rx="4" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="178" y="805" text-anchor="middle" class="pin">AA</text>
  <text x="243" y="805" text-anchor="middle" class="pin">AA</text>
  <text x="308" y="805" text-anchor="middle" class="pin">AA</text>
  <text x="373" y="805" text-anchor="middle" class="pin">AA</text>
  <circle cx="620" cy="775" r="6" class="dotr"/><text x="620" y="765" text-anchor="middle" class="pin" fill="#d32f2f">+</text>
  <circle cx="140" cy="775" r="6" class="dot"/><text x="140" y="765" text-anchor="middle" class="pin">−</text>

  <path class="wpos" d="M 620 775 L 700 775 L 700 695 L 830 695"/>
  <path class="wgnd" d="M 140 775 L 80 775 L 80 610 L 510 610"/>

  <path class="wgnd" d="M 80 775 L 80 860 L 845 860 L 845 695"/>
  <circle cx="80" cy="775" r="4" class="dot"/>

  <path class="wgnd" d="M 85 195 L 85 860"/>
  <circle cx="85" cy="860" r="4" class="dot"/>

  <path class="wgnd" d="M 370 350 L 370 450 L 510 450 L 510 610"/>

  <rect x="280" y="650" width="260" height="40" rx="6" fill="#fff8e1" stroke="#b26500" stroke-width="1.2"/>
  <text x="410" y="675" text-anchor="middle" class="note">Ground meets here — Mega GND + battery − share a net</text>

  <rect x="950" y="710" width="220" height="180" rx="8" class="legend-box"/>
  <text x="965" y="735" class="h">Wire colour key</text>
  <line x1="970" y1="758" x2="1010" y2="758" class="wpos"/><text x="1020" y="762" class="lbl">+ supply</text>
  <line x1="970" y1="780" x2="1010" y2="780" class="wgnd"/><text x="1020" y="784" class="lbl">GND</text>
  <line x1="970" y1="802" x2="1010" y2="802" class="wsig"/><text x="1020" y="806" class="lbl">Servo signal (PWM)</text>
  <line x1="970" y1="824" x2="1010" y2="824" class="wtx"/><text x="1020" y="828" class="lbl">TX  (Arduino → HC-05)</text>
  <line x1="970" y1="846" x2="1010" y2="846" class="wrx"/><text x="1020" y="850" class="lbl">RX  (HC-05 → Arduino)</text>
  <circle cx="990" cy="868" r="4" class="dot"/><text x="1020" y="872" class="lbl">Junction / shared node</text>
</svg>
